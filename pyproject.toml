[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "virallens-ai"
version = "2.0.0"
description = "Instagram Reel intelligence and competitor-analysis system"
readme = "README.md"
requires-python = ">=3.12"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --basetemp=scratch/pytest_tmp"
